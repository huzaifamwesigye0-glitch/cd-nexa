
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101b2b">
<title>CD NEXA — Connect Beyond Limits</title>
<style>
:root{
  --bg:#0b1421;--panel:#111f30;--panel2:#17283b;--panel3:#20354b;
  --text:#f3f7fb;--muted:#9aabba;--line:#26394d;
  --accent:#22d3b5;--accent2:#16a890;--bubble:#1c3447;
  --mine:#075f55;--danger:#ff7474;--shadow:0 12px 35px #0004;
}
body.light{
  --bg:#edf2f5;--panel:#fff;--panel2:#f5f8fa;--panel3:#e7eef2;
  --text:#182735;--muted:#687b89;--line:#dce5ea;
  --accent:#079e86;--accent2:#087e70;--bubble:#e8eef2;
  --mine:#c8f2e8;--shadow:0 12px 35px #24374612;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;max-width:1500px;margin:auto;display:flex;background:var(--panel);overflow:hidden}
.sidebar{width:365px;min-width:300px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
.side-head{padding:20px 18px 14px}
.brand-row{display:flex;align-items:center;justify-content:space-between}
.brand{font-size:24px;font-weight:850;letter-spacing:1px}
.brand span{color:var(--accent)}
.tagline{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.5px}
.icon-btn{border:0;background:var(--panel2);color:var(--text);width:40px;height:40px;border-radius:13px;font-size:18px}
.search-wrap{margin-top:18px;position:relative}
.search-wrap input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px 14px 13px 40px;color:var(--text);outline:none}
.search-wrap:before{content:"⌕";position:absolute;left:14px;top:7px;font-size:23px;color:var(--muted)}
.section-row{display:flex;align-items:center;justify-content:space-between;padding:15px 18px 9px}
.section-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1.2px}
.add-btn{border:0;background:var(--accent);color:#06251f;font-weight:800;border-radius:10px;padding:9px 12px;font-size:12px}
.nav{display:flex;gap:5px;padding:0 12px 12px}
.nav button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:11px;padding:10px 4px;font-size:12px;font-weight:700}
.nav button.active{background:var(--panel3);color:var(--accent)}
.chat-list{overflow-y:auto;flex:1;padding:0 9px 12px}
.chat-item{width:100%;display:flex;align-items:center;gap:12px;padding:12px 10px;border:0;background:transparent;color:var(--text);text-align:left;border-radius:13px}
.chat-item:hover,.chat-item.selected{background:var(--panel2)}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-weight:800;color:white;background:linear-gradient(140deg,#168e89,#315c91);font-size:15px}
.avatar.purple{background:linear-gradient(140deg,#7752aa,#b45f91)}
.avatar.orange{background:linear-gradient(140deg,#bd7841,#d7a34d)}
.avatar.blue{background:linear-gradient(140deg,#3568a4,#55a4b5)}
.avatar.green{background:linear-gradient(140deg,#28846a,#6da86b)}
.chat-meta{min-width:0;flex:1}
.chat-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.chat-name{font-weight:750;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:10px;color:var(--muted);white-space:nowrap}
.chat-preview{font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.main-head{height:76px;display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
.main-head .avatar{width:43px;height:43px}
.head-copy{flex:1;min-width:0}
.head-title{font-weight:800;font-size:15px}
.head-sub{font-size:11px;color:var(--muted);margin-top:4px}
.head-actions{display:flex;gap:8px}
.mobile-back{display:none}
.content{flex:1;min-height:0;overflow-y:auto}
.welcome{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}
.welcome-inner{max-width:370px}
.logo-mark{width:85px;height:85px;border-radius:27px;margin:0 auto 20px;display:grid;place-items:center;background:linear-gradient(145deg,#1b8f89,#1b4765);font-size:35px;font-weight:900;color:white;box-shadow:var(--shadow)}
.welcome h1{font-size:27px;margin:0 0 10px}
.welcome p{color:var(--muted);font-size:14px;line-height:1.7}
.small-note{font-size:11px;color:var(--muted);margin-top:22px}
.messages{padding:22px 5%;display:flex;flex-direction:column;gap:12px}
.day-label{text-align:center;color:var(--muted);font-size:10px;margin:8px 0 12px}
.message{max-width:min(75%,520px);padding:11px 14px;border-radius:15px;background:var(--bubble);font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.message.mine{align-self:flex-end;background:var(--mine);color:var(--text);border-bottom-right-radius:4px}
.message.theirs{align-self:flex-start;border-bottom-left-radius:4px}
.message-time{text-align:right;font-size:9px;opacity:.65;margin-top:5px}
.composer{display:flex;align-items:center;gap:9px;padding:13px 18px;background:var(--panel);border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:25px;padding:14px 17px;color:var(--text);outline:none}
.send-btn{width:47px;height:47px;border:0;border-radius:50%;background:var(--accent);color:#06251f;font-size:20px;font-weight:900}
.screen{padding:26px;max-width:850px;margin:0 auto;width:100%}
.screen h2{margin:0 0 7px;font-size:25px}
.screen-intro{color:var(--muted);font-size:13px;margin:0 0 23px;line-height:1.6}
.status-card,.setting-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:12px}
.status-card{display:flex;align-items:center;gap:13px}
.status-card .status-copy{flex:1}
.status-title{font-weight:750;font-size:14px}
.status-desc{color:var(--muted);font-size:12px;margin-top:5px}
.status-ring{padding:3px;border:2px solid var(--accent);border-radius:50%}
.primary-btn{border:0;border-radius:11px;padding:12px 16px;background:var(--accent);color:#06251f;font-weight:800}
.setting-card label{display:block;font-size:13px;font-weight:750;margin-bottom:9px}
.setting-card input[type=text]{width:100%;padding:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;outline:none}
.setting-line{display:flex;align-items:center;justify-content:space-between;gap:15px}
.setting-line p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.switch{width:48px;height:27px;border-radius:20px;background:var(--panel3);border:0;padding:3px}
.switch:after{content:"";display:block;width:21px;height:21px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:var(--accent)}
.switch.on:after{transform:translateX(21px);background:#fff}
.footer-note{color:var(--muted);font-size:11px;line-height:1.7;padding:12px 2px}
.empty{padding:35px 15px;text-align:center;color:var(--muted);font-size:13px}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#20394a;color:white;padding:12px 18px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);z-index:10;display:none;max-width:90%;text-align:center}
.mobile-nav{display:none}
@media(max-width:700px){
  .app{height:100dvh}
  .sidebar{width:100%;min-width:0;border:0}
  .main{display:none;width:100%}
  .app.show-main .sidebar{display:none}
  .app.show-main .main{display:flex}
  .main-head{height:68px;padding:10px 13px}
  .mobile-back{display:block}
  .screen{padding:22px 16px}
  .messages{padding:18px 13px}
  .composer{padding:10px}
  .message{max-width:86%}
  .side-head{padding:17px 15px 10px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="side-head">
      <div class="brand-row">
        <div>
          <div class="brand">CD <span>NEXA</span></div>
          <div class="tagline">CONNECT BEYOND LIMITS</div>
        </div>
        <button class="icon-btn" onclick="showScreen('settings')" aria-label="Settings">⚙</button>
      </div>
      <div class="search-wrap"><input id="search" placeholder="Search conversations..." oninput="renderChats()"></div>
    </div>
    <div class="section-row">
      <span class="section-label" id="listHeading">MESSAGES</span>
      <button class="add-btn" onclick="addContact()">＋ Add contact</button>
    </div>
    <div class="nav">
      <button id="navChats" class="active" onclick="showScreen('chats')">▣ Chats</button>
      <button id="navStatus" onclick="showScreen('status')">◉ Status</button>
      <button id="navSettings" onclick="showScreen('settings')">⚙ Settings</button>
    </div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <main class="main">
    <header class="main-head">
      <button class="icon-btn mobile-back" onclick="backToMenu()" aria-label="Back">‹</button>
      <div class="avatar" id="headAvatar">N</div>
      <div class="head-copy">
        <div class="head-title" id="headTitle">Welcome to CD NEXA</div>
        <div class="head-sub" id="headSub">Your conversations, in one place</div>
      </div>
      <div class="head-actions" id="headActions"></div>
    </header>
    <div class="content" id="content">
      <div class="welcome">
        <div class="welcome-inner">
          <div class="logo-mark">N</div>
          <h1>Connect beyond limits.</h1>
          <p>Welcome to CD NEXA. Choose a conversation or add a contact to explore your messaging space.</p>
          <button class="primary-btn" onclick="addContact()">＋ Add your first contact</button>
          <div class="small-note">A new way to stay connected.</div>
        </div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY="cdnexa_v2_data";
const defaultData={
  profile:"My Profile",
  theme:"dark",
  contacts:[
    {id:"nexa",name:"NEXA Assistant",initials:"NA",color:"",messages:[{text:"Welcome to CD NEXA! This is a local preview. You can explore the interface and send test messages.",mine:false,time:"09:00"}]},
    {id:"alex",name:"Alex Morgan",initials:"AM",color:"purple",messages:[{text:"Hey! Welcome to NEXA 👋",mine:false,time:"Yesterday"}]},
    {id:"family",name:"Family Group",initials:"FG",color:"orange",messages:[{text:"Good morning everyone ❤️",mine:false,time:"Yesterday"}]},
    {id:"sarah",name:"Sarah",initials:"S",color:"blue",messages:[{text:"Talk to you later!",mine:false,time:"Monday"}]}
  ],
  statuses:[]
};
let data=loadData();
let activeId=null;
let currentScreen="chats";

function loadData(){
  try{
    const saved=JSON.parse(localStorage.getItem(KEY));
    if(saved && Array.isArray(saved.contacts)) return {...defaultData,...saved};
  }catch(e){}
  return JSON.parse(JSON.stringify(defaultData));
}
function saveData(){localStorage.setItem(KEY,JSON.stringify(data))}
function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;el.style.display="block";
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.style.display="none",2600);
}
function initials(name){
  return name.trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase();
}
function avatarClass(contact){return contact.color||""}
function setHeader(title,sub,initial="N",color=""){
  document.getElementById("headTitle").textContent=title;
  document.getElementById("headSub").textContent=sub;
  const a=document.getElementById("headAvatar");
  a.textContent=initial;a.className="avatar "+color;
}
function setNav(){
  ["Chats","Status","Settings"].forEach(s=>{
    document.getElementById("nav"+s).classList.toggle("active",currentScreen===s.toLowerCase());
  });
  document.getElementById("listHeading").textContent=currentScreen==="chats"?"MESSAGES":currentScreen.toUpperCase();
}
function showScreen(screen){
  currentScreen=screen;
  activeId=null;
  document.getElementById("app").classList.add("show-main");
  setNav();
  document.getElementById("headActions").innerHTML="";
  if(screen==="chats"){
    setHeader("Your conversations","Select a chat to get started","N");
    renderWelcome();
  }else if(screen==="status"){
    setHeader("Status","Share a moment with your contacts","◉");
    renderStatus();
  }else{
    setHeader("Settings","Make CD NEXA yours","⚙");
    renderSettings();
  }
  renderChats();
}
function backToMenu(){
  document.getElementById("app").classList.remove("show-main");
  activeId=null;
}
function renderWelcome(){
  document.getElementById("content").innerHTML=`
  <div class="welcome"><div class="welcome-inner">
  <div class="logo-mark">N</div><h1>Connect beyond limits.</h1>
  <p>Welcome to CD NEXA. Choose a conversation or add a contact to explore your messaging space.</p>
  <button class="primary-btn" onclick="addContact()">＋ Add your first contact</button>
  <div class="small-note">Your messages in this preview are saved on this device only.</div>
  </div></div>`;
}
function renderChats(){
  const list=document.getElementById("chatList");
  const q=(document.getElementById("search").value||"").toLowerCase();
  if(currentScreen!=="chats"){list.innerHTML="";return}
  const contacts=data.contacts.filter(c=>c.name.toLowerCase().includes(q));
  if(!contacts.length){list.innerHTML='<div class="empty">No conversations found.</div>';return}
  list.innerHTML=contacts.map(c=>{
    const last=c.messages[c.messages.length-1];
    return `<button class="chat-item ${activeId===c.id?"selected":""}" onclick="openChat('${c.id}')">
      <div class="avatar ${avatarClass(c)}">${escapeHTML(c.initials||initials(c.name))}</div>
      <div class="chat-meta"><div class="chat-top"><span class="chat-name">${escapeHTML(c.name)}</span><span class="chat-time">${escapeHTML(last?.time||"")}</span></div>
      <div class="chat-preview">${last?(last.mine?"You: ":"")+escapeHTML(last.text):"Start a conversation"}</div></div>
    </button>`;
  }).join("");
}
function openChat(id){
  const c=data.contacts.find(x=>x.id===id);if(!c)return;
  activeId=id;currentScreen="chats";setNav();renderChats();
  setHeader(c.name,"Local preview conversation",c.initials||initials(c.name),avatarClass(c));
  document.getElementById("headActions").innerHTML='<button class="icon-btn" onclick="toast(\'Voice calls are not connected in this preview.\')">☎</button>';
  document.getElementById("app").classList.add("show-main");
  renderMessages();
}
function renderMessages(){
  const c=data.contacts.find(x=>x.id===activeId);if(!c)return;
  document.getElementById("content").innerHTML=`
  <div class="messages" id="messages">
    <div class="day-label">LOCAL PREVIEW • MESSAGES STAY ON THIS DEVICE</div>
    ${c.messages.map(m=>`<div class="message ${m.mine?"mine":"theirs"}">${escapeHTML(m.text)}<div class="message-time">${escapeHTML(m.time||"")}</div></div>`).join("")}
  </div>
  <form class="composer" onsubmit="sendMessage(event)">
    <input id="messageInput" autocomplete="off" placeholder="Write a message..." aria-label="Write a message">
    <button class="send-btn" type="submit" aria-label="Send message">➤</button>
  </form>`;
  const box=document.getElementById("messages");box.scrollTop=box.scrollHeight;
}
function sendMessage(event){
  event.preventDefault();
  const input=document.getElementById("messageInput");
  const text=input.value.trim();if(!text||!activeId)return;
  const c=data.contacts.find(x=>x.id===activeId);
  c.messages.push({text,mine:true,time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})});
  saveData();renderMessages();renderChats();
}
function addContact(){
  const name=prompt("Enter the contact's name:");
  if(!name||!name.trim())return;
  const clean=name.trim();
  if(data.contacts.some(c=>c.name.toLowerCase()===clean.toLowerCase())){
    toast("That contact already exists.");return;
  }
  const id="contact_"+Date.now();
  data.contacts.unshift({id,name:clean,initials:initials(clean),color:"green",messages:[]});
  saveData();showScreen("chats");openChat(id);
  toast("Contact added to this device.");
}
function renderStatus(){
  const own=data.statuses.filter(s=>s.owner==="me");
  document.getElementById("content").innerHTML=`
  <div class="screen">
    <h2>Share a moment.</h2>
    <p class="screen-intro">Post a short text update in your local preview.</p>
    <div class="status-card">
      <div class="status-ring"><div class="avatar">${escapeHTML(initials(data.profile))}</div></div>
      <div class="status-copy"><div class="status-title">My status</div><div class="status-desc">${own.length?escapeHTML(own[0].text):"No update shared yet"}</div></div>
      <button class="primary-btn" onclick="addStatus()">＋ Update</button>
    </div>
    <h3 style="font-size:12px;color:var(--muted);letter-spacing:1px;margin:25px 0 12px">RECENT UPDATES</h3>
    ${data.statuses.filter(s=>s.owner!=="me").map(s=>`<div class="status-card"><div class="avatar purple">${escapeHTML(s.initials)}</div><div class="status-copy"><div class="status-title">${escapeHTML(s.owner)}</div><div class="status-desc">${escapeHTML(s.text)}</div></div></div>`).join("")||'<div class="empty">No contact updates yet. Status sharing is local in this preview.</div>'}
    <p class="footer-note">Status updates here are saved only in this browser. They are not shared with other users yet.</p>
  </div>`;
}
function addStatus(){
  const text=prompt("Write your status update:");
  if(!text||!text.trim())return;
  data.statuses.unshift({owner:"me",initials:initials(data.profile),text:text.trim(),time:Date.now()});
  saveData();renderStatus();toast("Your local status was added.");
}
function renderSettings(){
  document.getElementById("content").innerHTML=`
  <div class="screen">
    <h2>Settings</h2>
    <p class="screen-intro">Personalise your CD NEXA preview.</p>
    <div class="setting-card">
      <label for="profileName">Your display name</label>
      <input id="profileName" type="text" value="${escapeHTML(data.profile)}" maxlength="35">
      <button class="primary-btn" style="margin-top:12px" onclick="saveProfile()">Save name</button>
    </div>
    <div class="setting-card">
      <div class="setting-line"><div><div style="font-weight:750;font-size:14px">Dark appearance</div><p>Switch between dark and light themes.</p></div>
      <button id="themeSwitch" class="switch ${data.theme==="dark"?"on":""}" onclick="toggleTheme()" aria-label="Toggle theme"></button></div>
    </div>
    <div class="setting-card">
      <div style="font-weight:750;font-size:14px">Your data</div>
      <p class="status-desc">Your preview conversations are stored in this browser on this device.</p>
      <button class="primary-btn" style="margin-top:12px" onclick="exportData()">Export backup</button>
      <button class="primary-btn" style="margin-top:12px;background:#a94343;color:white" onclick="clearData()">Reset preview data</button>
    </div>
    <div class="setting-card">
      <div style="font-weight:750;font-size:14px">About CD NEXA</div>
      <p class="status-desc">Connect Beyond Limits. Version 0.2 • Local preview.</p>
      <p class="footer-note">This version does not yet have online accounts, cloud messages, real calls, or end-to-end encryption. Do not use it for private or sensitive messages.</p>
    </div>
  </div>`;
}
function saveProfile(){
  const value=document.getElementById("profileName").value.trim();
  if(!value){toast("Please enter a display name.");return}
  data.profile=value;saveData();toast("Display name saved.");
}
function toggleTheme(){
  data.theme=data.theme==="dark"?"light":"dark";
  saveData();applyTheme();renderSettings();
}
function applyTheme(){document.body.classList.toggle("light",data.theme==="light")}
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download="cd-nexa-backup.json";a.click();URL.revokeObjectURL(url);
  toast("Backup prepared.");
}
function clearData(){
  if(!confirm("Reset all local preview contacts, messages and statuses?"))return;
  data=JSON.parse(JSON.stringify(defaultData));saveData();applyTheme();showScreen("chats");
  toast("Preview data reset.");
}
applyTheme();
showScreen("chats");
</script>
</body>
</html>
