<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>CD NEXA — Connect Beyond Limits</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2b;--panel2:#102238;--line:#20364d;--text:#edf5ff;--muted:#8fa4ba;--accent:#22c7b8;--accent2:#5b8cff;--danger:#ff6b78;--shadow:0 18px 55px #0005}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{height:100dvh;display:grid;grid-template-columns:78px 360px 1fr;max-width:1600px;margin:auto;background:var(--panel);overflow:hidden}.rail{background:#081522;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:20px 10px;gap:14px}.brand{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#04131d;font-weight:900;font-size:18px;margin-bottom:22px}.navbtn{width:48px;height:48px;border:0;border-radius:15px;background:transparent;color:var(--muted);font-size:20px;position:relative}.navbtn:hover,.navbtn.active{background:#173047;color:var(--accent)}.navbtn.active:before{content:"";position:absolute;left:-15px;top:12px;height:24px;width:3px;background:var(--accent);border-radius:4px}.rail-spacer{flex:1}.sidebar{min-width:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#0b1928}.sidehead{padding:22px 20px 14px}.side-title{display:flex;align-items:center;justify-content:space-between}.side-title h1{font-size:23px;letter-spacing:-.7px;margin:0}.side-title small{color:var(--accent);font-size:10px;letter-spacing:2px;font-weight:800}.iconbtn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;width:38px;height:38px}.search{margin-top:17px;display:flex;gap:9px;background:#102238;border:1px solid var(--line);border-radius:13px;padding:0 12px;align-items:center}.search input{width:100%;padding:12px 0;background:transparent;border:0;outline:0;color:var(--text)}.tabs{display:flex;gap:7px;padding:0 16px 13px;overflow:auto}.tab{border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 12px;border-radius:20px;font-size:12px;white-space:nowrap}.tab.active{background:#123a40;border-color:#1c7773;color:#74f0df}.list{overflow:auto;flex:1}.section-label{padding:9px 20px;color:#668198;font-size:10px;letter-spacing:1.7px;font-weight:800}.chatrow{display:flex;gap:12px;padding:13px 17px;align-items:center;cursor:pointer;border-left:3px solid transparent}.chatrow:hover{background:#102238}.chatrow.selected{background:#142b40;border-left-color:var(--accent)}.avatar{width:48px;height:48px;flex:0 0 48px;border-radius:16px;background:linear-gradient(145deg,#24536a,#263e70);display:grid;place-items:center;font-weight:800;color:#d8f8ff;position:relative}.avatar.online:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#38d9a9;border:2px solid var(--panel);right:-1px;bottom:0}.chatmeta{min-width:0;flex:1}.chatline{display:flex;justify-content:space-between;gap:8px}.chatname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time,.preview{font-size:11px;color:var(--muted)}.preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.unread{background:var(--accent);color:#04201f;border-radius:20px;padding:2px 7px;font-size:10px;font-weight:900}.main{min-width:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at 70% 0%,#12304a 0%,#0b1928 55%)}.welcome{margin:auto;text-align:center;max-width:430px;padding:28px}.logo-large{width:82px;height:82px;margin:0 auto 20px;border-radius:27px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#061724;font-size:32px;font-weight:950;box-shadow:0 12px 40px #22c7b833}.welcome h2{font-size:29px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0}.chatview{height:100%;display:none;flex-direction:column}.chathead{height:76px;padding:12px 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:#0b1a29dd}.chathead .avatar{width:43px;height:43px;flex-basis:43px;border-radius:14px}.person{flex:1;min-width:0}.person strong{display:block}.person small{color:var(--muted)}.head-actions{display:flex;gap:8px}.messages{flex:1;overflow:auto;padding:24px clamp(14px,5vw,65px);display:flex;flex-direction:column;gap:11px}.daylabel{text-align:center;color:var(--muted);font-size:11px;margin:8px 0 12px}.bubble{max-width:min(75%,520px);padding:11px 14px;border-radius:16px;background:#172b40;border:1px solid #25415a;align-self:flex-start;overflow-wrap:anywhere;box-shadow:0 5px 15px #0001}.bubble.mine{align-self:flex-end;background:linear-gradient(135deg,#0e625f,#15516a);border-color:#237c79;border-bottom-right-radius:5px}.bubble:not(.mine){border-bottom-left-radius:5px}.bubble time{display:block;text-align:right;color:#b1c8d6;font-size:10px;margin-top:5px}.composer-wrap{padding:14px 20px 18px;border-top:1px solid var(--line);background:#0b1a29}.composer{display:flex;align-items:flex-end;gap:9px;max-width:1000px;margin:auto}.composebox{flex:1;display:flex;align-items:flex-end;background:#14283c;border:1px solid #29445d;border-radius:17px;padding:6px 10px;gap:8px}.composebox textarea{resize:none;max-height:120px;min-height:40px;flex:1;background:transparent;border:0;outline:0;color:var(--text);padding:9px 2px}.send{width:44px;height:44px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--accent),#4d9ff4);color:#061724;font-size:18px;font-weight:900}.mutedbtn{color:var(--muted);background:transparent;border:0;font-size:18px;padding:9px}.empty-note{color:var(--muted);text-align:center;margin:auto}.mobile-back{display:none}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#17394b;border:1px solid #2c6571;padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:5}.settings-panel{padding:30px;max-width:700px}.settings-panel h2{margin-top:0}.setting{padding:17px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.setting span{color:var(--muted);font-size:13px}.switch{accent-color:var(--accent)}@media(max-width:850px){.app{grid-template-columns:62px minmax(250px,320px) 1fr}.rail{padding:15px 6px}.navbtn{width:44px;height:44px}}@media(max-width:650px){.app{grid-template-columns:58px 1fr}.sidebar{grid-column:2;grid-row:1}.main{display:none;grid-column:2;grid-row:1}.app.chat-open .sidebar{display:none}.app.chat-open .main{display:flex}.rail{grid-column:1;grid-row:1}.chatview{height:100%}.chathead{padding:10px 12px}.mobile-back{display:inline-block}.head-actions .optional{display:none}.messages{padding:18px 12px}.bubble{max-width:88%}.composer-wrap{padding:10px}.sidehead{padding:18px 14px 12px}.chatrow{padding:12px}.tabs{padding-left:12px}.settings-panel{padding:20px}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail">
    <div class="brand">N</div>
    <button class="navbtn active" title="Chats" data-view="chats">▤</button>
    <button class="navbtn" title="Status" data-view="status">◉</button>
    <button class="navbtn" title="Communities" data-view="communities">♧</button>
    <button class="navbtn" title="Calls" data-view="calls">⌕</button>
    <div class="rail-spacer"></div>
    <button class="navbtn" title="Settings" data-view="settings">⚙</button>
    <button class="navbtn" title="Profile" data-view="profile">●</button>
  </aside>
  <aside class="sidebar">
    <header class="sidehead">
      <div class="side-title"><div><small>CONNECT BEYOND LIMITS</small><h1>CD NEXA</h1></div><button class="iconbtn" id="newChat" title="New chat">＋</button></div>
      <label class="search">⌕ <input id="search" placeholder="Search conversations"></label>
    </header>
    <div class="tabs" id="filters">
      <button class="tab active" data-filter="all">All</button><button class="tab" data-filter="unread">Unread</button><button class="tab" data-filter="groups">Groups</button>
    </div>
    <div class="list" id="chatList"><div class="section-label">MESSAGES</div></div>
  </aside>
  <main class="main">
    <section class="welcome" id="welcome"><div class="logo-large">N</div><h2>Connect Beyond Limits.</h2><p>Your conversations, brought together in one calm, premium space. Choose a chat to begin.</p></section>
    <section class="chatview" id="chatView">
      <header class="chathead">
        <button class="mutedbtn mobile-back" id="back">‹</button>
        <div class="avatar" id="headAvatar">A</div>
        <div class="person"><strong id="headName">Contact</strong><small id="headStatus">CD NEXA conversation</small></div>
        <div class="head-actions"><button class="iconbtn optional" title="Voice call" id="voiceCall">☎</button><button class="iconbtn optional" title="Video call" id="videoCall">▣</button><button class="iconbtn" title="More options" id="more">⋯</button></div>
      </header>
      <div class="messages" id="messages"></div>
      <div class="composer-wrap"><form class="composer" id="messageForm">
        <button class="mutedbtn" type="button" id="attach" title="Attachment">＋</button>
        <div class="composebox"><button class="mutedbtn" type="button" id="emoji" title="Emoji">☺</button><textarea id="messageInput" rows="1" placeholder="Write a message…"></textarea><button class="mutedbtn" type="button" id="voice" title="Voice note">♩</button></div>
        <button class="send" type="submit" title="Send message">➤</button>
      </form></div>
    </section>
    <section class="settings-panel" id="otherView" hidden></section>
  </main>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" hidden>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const KEY = "cdnexa_demo_v1";
  const starter = [
    {id:"a",name:"Alex Morgan",group:false,online:true,unread:2,messages:[{text:"Hey! Welcome to CD NEXA.",mine:false,time:"10:24"},{text:"This interface is looking clean.",mine:false,time:"10:25"}]},
    {id:"b",name:"NEXA Team",group:true,online:false,unread:0,messages:[{text:"Project group created. More updates soon.",mine:false,time:"Yesterday"}]},
    {id:"c",name:"Sarah",group:false,online:false,unread:0,messages:[{text:"Talk to you later 👋",mine:false,time:"Yesterday"}]},
    {id:"d",name:"David",group:false,online:true,unread:1,messages:[{text:"Are we still meeting today?",mine:false,time:"Mon"}]}
  ];
  let data;
  try { data = JSON.parse(localStorage.getItem(KEY)) || starter; } catch { data = starter; }
  if (!Array.isArray(data)) data = starter;
  let activeId = null, filter = "all", currentView = "chats";
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };
  const initials = name => (name || "?").trim().split(/\s+/).slice(0,2).map(x=>x[0] || "").join("").toUpperCase() || "?";
  const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const toast = msg => { $("toast").textContent=msg; $("toast").style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>$("toast").style.display="none",2300); };
  const activeChat = () => data.find(c=>c.id===activeId);
  function renderList(){
    const q=$("search").value.toLowerCase().trim();
    const rows=data.filter(c=>(filter==="all" || (filter==="unread" && c.unread>0) || (filter==="groups" && c.group)) && (c.name.toLowerCase().includes(q) || c.messages.some(m=>m.text.toLowerCase().includes(q))));
    $("chatList").innerHTML='<div class="section-label">MESSAGES</div>'+ (rows.length?rows.map(c=>{
      const last=c.messages[c.messages.length-1];
      return `<div class="chatrow ${c.id===activeId?"selected":""}" data-id="${esc(c.id)}"><div class="avatar ${c.online?"online":""}">${esc(initials(c.name))}</div><div class="chatmeta"><div class="chatline"><span class="chatname">${esc(c.name)}</span><span class="time">${esc(last?.time||"")}</span></div><div class="chatline"><span class="preview">${esc(last?.text||"No messages yet")}</span>${c.unread?`<span class="unread">${c.unread}</span>`:""}</div></div></div>`;
    }).join(""):'<div class="empty-note">No conversations found.</div>');
  }
  function openChat(id){
    const c=data.find(x=>x.id===id); if(!c)return;
    activeId=id;c.unread=0;save();$("welcome").style.display="none";$("otherView").hidden=true;$("chatView").style.display="flex";$("app").classList.add("chat-open");
    $("headAvatar").textContent=initials(c.name);$("headName").textContent=c.name;$("headStatus").textContent=c.group?"Group conversation":(c.online?"● Online":"CD NEXA contact");
    renderMessages();renderList();currentView="chats";
  }
  function renderMessages(){
    const c=activeChat();if(!c)return;
    $("messages").innerHTML='<div class="daylabel">TODAY · DEMO CONVERSATION</div>'+c.messages.map(m=>`<div class="bubble ${m.mine?"mine":""}">${esc(m.text)}<time>${esc(m.time||"")}${m.mine?" · ✓":""}</time></div>`).join("");
    $("messages").scrollTop=$("messages").scrollHeight;
  }
  function sendMessage(text){
    const c=activeChat();if(!c || !text.trim())return;
    const now=new Date();c.messages.push({text:text.trim(),mine:true,time:now.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})});save();renderMessages();renderList();
  }
  function showView(view){
    currentView=view;$("app").classList.remove("chat-open");$("chatView").style.display="none";$("welcome").style.display="none";$("otherView").hidden=false;
    document.querySelectorAll(".navbtn[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
    const content={
      status:["Status","Status updates are a planned interface area. Live status sharing is not connected."],
      communities:["Communities","Community discovery and group management are planned. No live community service is connected."],
      calls:["Calls","Call history and voice/video calling are not connected in this interface prototype."],
      settings:["Settings","Your preferences are stored only in this browser on this device."],
      profile:["Profile","CD NEXA profile controls are a visual prototype. Account services are not connected."]
    }[view] || ["CD NEXA","Connect Beyond Limits."];
    $("otherView").innerHTML=`<h2>${content[0]}</h2><p style="color:var(--muted)">${content[1]}</p><div class="setting"><div><b>Interface status</b><br><span>Frontend prototype · demo data</span></div><span>LOCAL</span></div><div class="setting"><div><b>Privacy and security</b><br><span>Server-side privacy enforcement is not implemented yet.</span></div><span>NOT CONNECTED</span></div><button class="tab" id="backToChats">← Back to chats</button>`;
    $("backToChats").onclick=()=>{document.querySelector('[data-view="chats"]').click();};
  }
  $("chatList").addEventListener("click",e=>{const row=e.target.closest(".chatrow");if(row)openChat(row.dataset.id);});
  $("search").addEventListener("input",renderList);
  $("filters").addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;filter=b.dataset.filter;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));renderList();});
  document.querySelectorAll(".navbtn[data-view]").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.view==="chats"){ $("app").classList.remove("chat-open");$("otherView").hidden=true;$("chatView").style.display="none";$("welcome").style.display="block";document.querySelectorAll(".navbtn").forEach(x=>x.classList.toggle("active",x===b));}else showView(b.dataset.view);}));
  $("messageForm").addEventListener("submit",e=>{e.preventDefault();sendMessage($("messageInput").value);$("messageInput").value="";$("messageInput").style.height="40px";});
  $("messageInput").addEventListener("input",e=>{e.target.style.height="40px";e.target.style.height=Math.min(e.target.scrollHeight,120)+"px";});
  $("back").onclick=()=>{$("app").classList.remove("chat-open");};
  $("newChat").onclick=()=>{const name=prompt("Enter the contact or group name:");if(!name?.trim())return;const c={id:"n"+Date.now(),name:name.trim(),group:false,online:false,unread:0,messages:[]};data.unshift(c);save();renderList();openChat(c.id);};
  $("attach").onclick=()=>$("fileInput").click();
  $("fileInput").onchange=e=>{const f=e.target.files[0];if(f){toast("Selected: "+f.name+" · Upload is not connected.");e.target.value="";}};
  $("emoji").onclick=()=>{$("messageInput").value+="😊";$("messageInput").focus();};
  $("voice").onclick=()=>toast("Voice-note recording is not connected yet.");
  $("voiceCall").onclick=()=>toast("Voice calling is not connected yet.");
  $("videoCall").onclick=()=>toast("Video calling is not connected yet.");
  $("more").onclick=()=>toast("More chat options will be added during interface refinement.");
  renderList();
})();
</script>
</body>
                                  </html>
